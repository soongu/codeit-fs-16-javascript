<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <button id="call-ai">ai 부르기</button>
    </form>

    <p class="ai-result"></p>

    <script>
      const API_KEY = '';
      const url =
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent';

      document.querySelector('#call-ai').addEventListener('click', event => {
        event.preventDefault();
        aiCall();
      });

      function aiCall() {
        // fetch는 기본이 GET요청
        fetch(url, {
          method: 'POST',
          headers: {
            'x-goog-api-key': API_KEY,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  {
                    text: 'javascript는 다른 언어에 비해 배우기 어려운가요?',
                  },
                ],
              },
            ],
          }),
        })
        .then(res => res.json())
        .then(result => {
          document.querySelector('.ai-result').textContent 
            = result.candidates[0].content.parts[0].text;
        });
        ;
      }
    </script>
  </body>
</html>
